name: Build Android APK (Release)

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "index.html"
      - "app.js"
      - "config.js"
      - "style.css"
      - "manifest.json"
      - "icons/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r index.html style.css config.js app.js manifest.json icons android/app/src/main/assets/web/

      - name: Ensure Keystore Exists
        run: |
          mkdir -p android/app/keystore
          if [ ! -f "android/app/keystore/release-key.jks" ]; then
            echo "Generating persistent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/keystore/release-key.jks \
              -alias appkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "animewatch_poco_release" \
              -keypass "animewatch_poco_release" \
              -dname "CN=AnimeWatch, OU=Mobile, O=Martiri, L=Bologna, ST=BO, C=IT"
          fi
          chmod 600 android/app/keystore/release-key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: "animewatch_poco_release"
          KEY_ALIAS: "appkey"
          KEY_PASSWORD: "animewatch_poco_release"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/AnimeWatch-v1.0.1.apk
          ls -lh dist-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWatch-POCO-F7-v1.0.1
          path: dist-apk/AnimeWatch-v1.0.1.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.1"
          cat << 'EOF' > release_notes.md
          ### 📱 AnimeWatch v1.0.1 — APK Nativo per Xiaomi POCO F7
          
          - **Icone Adattive Native Corrette**: risolto il riferimento circolare delle Adaptive Icons per Xiaomi HyperOS / POCO F7, ora dotate di tutte le densità (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi).
          - **Display 120Hz Lock**: rendering a 120 fps forzato sul display AMOLED di HyperOS 2.
          - **Offline-First Bundled**: interfaccia web integrata via AndroidX WebViewAssetLoader (avvio istantaneo a 0ms).
          - **100% Play Protect Clean**: zero permessi pericolosi (eliminato `REQUEST_INSTALL_PACKAGES`).
          - **Firma Permanente RSA-2048**: aggiornamento in-place diretto senza disinstallare la versione precedente.
          - **Intent Dispatcher**: apertura diretta delle app streaming (Crunchyroll, Netflix, Disney+, Prime Video, ecc.).
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Updating existing release $TAG_NAME with new APK..."
            gh release upload "$TAG_NAME" dist-apk/AnimeWatch-v1.0.1.apk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist-apk/AnimeWatch-v1.0.1.apk \
              --title "AnimeWatch v1.0.1 (Icone Adaptive & 120Hz)" \
              --notes-file release_notes.md
          fi
