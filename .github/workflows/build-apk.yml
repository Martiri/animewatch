name: Build Android APK (Release)

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "index.html"
      - "app.js"
      - "config.js"
      - "style.css"
      - "manifest.json"
      - "icons/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r index.html style.css config.js app.js manifest.json icons android/app/src/main/assets/web/

      - name: Ensure Keystore Exists
        run: |
          mkdir -p android/app/keystore
          if [ ! -f "android/app/keystore/release-key.jks" ]; then
            echo "Generating persistent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/keystore/release-key.jks \
              -alias appkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "animewatch_poco_release" \
              -keypass "animewatch_poco_release" \
              -dname "CN=AnimeWatch, OU=Mobile, O=Martiri, L=Bologna, ST=BO, C=IT"
          fi
          chmod 600 android/app/keystore/release-key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: "animewatch_poco_release"
          KEY_ALIAS: "appkey"
          KEY_PASSWORD: "animewatch_poco_release"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/AnimeWatch-v2.2.0.apk
          ls -lh dist-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWatch-POCO-F7-v2.2.0
          path: dist-apk/AnimeWatch-v2.2.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.2.0"
          cat << 'EOF' > release_notes.md
          ### AnimeWatch v2.2.0 — Stile Morbido, Zero Sovrapposizioni & Prestazioni 120Hz

          - **Stile Morbido & Glass Funzionale**: raggi di curvatura gerarchici (`12px`–`24px`), bordo speculare discreto e glass solo su barre/modali.
          - **Zero Sovrapposizioni**: provider spostati dalla copertina al corpo card, header compatto per schermi stretti, griglie `minmax(0, 1fr)`.
          - **Più Veloce a 120Hz**: `content-visibility: auto`, `decoding="async"`, debounce salvataggio cache e aggiornamento chirurgico dei metadati senza redraw della griglia.
          - **Aggiornamento In-Place**: firmato con la stessa chiave RSA-2048 (`it.franco.animewatch`).
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Updating existing release $TAG_NAME with new APK..."
            gh release upload "$TAG_NAME" dist-apk/AnimeWatch-v2.2.0.apk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist-apk/AnimeWatch-v2.2.0.apk \
              --title "AnimeWatch v2.2.0 (Smooth & Fast Edition)" \
              --notes-file release_notes.md
          fi
